name: DevSecOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────
  # PARTIE 2 — Build Docker + Lint YAML
  # ─────────────────────────────────────────
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de yamllint
        run: pip install yamllint

      - name: Lint des fichiers YAML
        run: yamllint k8s/deployment.yaml .github/workflows/ci.yml

      - name: Build de l'image Docker
        run: docker build -t devsecops-api:latest .

  # ─────────────────────────────────────────
  # PARTIE 3 — Scan de sécurité avec Trivy
  # ─────────────────────────────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Scan des dépendances (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

      - name: Build image pour scan
        run: docker build -t devsecops-api:latest .

      - name: Scan de l'image Docker (Trivy image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "devsecops-api:latest"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  # ─────────────────────────────────────────
  # PARTIE 4 — Politique Conftest / Rego
  # ─────────────────────────────────────────
  conftest-policy:
    name: Conftest Policy Check
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.50.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Vérification de la politique Kubernetes (no root)
        run: conftest test k8s/deployment.yaml --policy policy/